# Config de build + hébergement (Netlify / compatible Cloudflare Pages).
# Permet un déploiement automatique propre depuis Git (build + SPA fallback).
[build]
  command = "npm run build"
  publish = "dist"

# Application en page unique : toute route retombe sur index.html (pas de 404).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
